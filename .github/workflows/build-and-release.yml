name: Olake UI Build And Release
on:
  workflow_call:
    inputs:
      environment:
        description: "Environment to build (master, staging, dev)"
        required: true
        default: ""
        type: string
      ref:
        description: "Git ref (branch/tag/SHA) to build from. If empty, derived from environment mapping."
        required: false
        default: ""
        type: string
      version:
        description: "Version to release"
        required: true
        default: ""
        type: string
  workflow_dispatch:
    inputs:
      environment:
        description: "Environment to build (master, staging, dev)"
        required: true
        default: "dev"
        type: choice
        options:
          - master
          - staging
          - dev
      ref:
        description: "Git ref (branch/tag/SHA) to build from (optional). If empty, derived from environment mapping."
        required: false
        default: ""
        type: string
      version:
        description: "Version to release"
        required: true
        default: "v0.0.0.dev"
        type: string

permissions:
  contents: read

jobs:
  # Builds the UI once and cross-compiles the server for each platform on the runner
  # (`make dist`). This job has no access to the Docker Hub credentials.
  build:
    name: Build release artifacts for ${{ inputs.environment }}
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.ref.outputs.sha }}
    steps:
      - name: Resolve ref
        id: resolve
        env:
          INPUT_REF: ${{ inputs.ref }}
          ENVIRONMENT: ${{ inputs.environment }}
        run: |
          if [[ -n "$INPUT_REF" ]]; then
            ref="$INPUT_REF"
          else
            case "$ENVIRONMENT" in
              master) ref=master ;;
              dev) ref=ci/workerReleaseIssues ;;
              *) ref=staging ;;
            esac
          fi
          echo "ref=$ref" >> "$GITHUB_OUTPUT"

      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.resolve.outputs.ref }}
          persist-credentials: false

      # The push job checks out this exact commit, so the image always matches the artifacts.
      - name: Record commit
        id: ref
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum

      # pnpm version comes from the packageManager field in ui/package.json.
      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          package_json_file: ui/package.json

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: ui/pnpm-lock.yaml

      - name: Build UI and server binaries
        run: make dist PLATFORMS="linux/amd64 linux/arm64"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-artifacts
          path: |
            dist/
            ui/dist/
          if-no-files-found: error
          retention-days: 1

  # Packages the prebuilt artifacts into the multi-arch image and pushes it. The Dockerfile
  # only copies files, so no QEMU is needed.
  push:
    name: Build and publish frontend image for ${{ inputs.environment }}
    needs: build
    environment: ${{ inputs.environment }}
    runs-on: ubuntu-latest
    env:
      DOCKER_LOGIN: ${{ secrets.DOCKER_USERNAME }}
      DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
      DOCKER_REPO: ${{ secrets.DOCKER_REPO || 'olakego' }}
      ENVIRONMENT: ${{ inputs.environment }}
      VERSION: ${{ inputs.version }}
      SKIP_ARTIFACT_BUILD: "true"
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.build.outputs.sha }}
          persist-credentials: false

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: release-artifacts
          path: .

      - name: Run Release tool
        run: |
          chmod +x ./release.sh
          ./release.sh
        shell: bash
