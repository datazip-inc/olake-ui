overrides:
  '@humanfs/node': ^0.16.8
  brace-expansion@1: ^1.1.16
  browserslist: ^4.28.7
  fast-uri: 3.1.9
  flatted: ^3.4.2
  follow-redirects: ^1.16.2
  form-data: 4.0.6
  js-yaml@4: ^4.3.2
  lodash: '>=4.18.1'
  lodash-es: '>=4.18.1'
  minimatch@3: ^3.1.3
