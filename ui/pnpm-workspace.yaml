  # requests minimatch@^9; remove it once typescript-eslint depends on a fixed version.
  minimatch@9: ^11.0.1
  moment: ^2.31.0
  nanoid@3: ^3.3.12
  picomatch@2: ^2.3.2
  picomatch@4: ^4.0.4
  postcss@8: ^8.5.18
  rollup@4: ^4.59.0
  source-map-js: ^1.2.2
allowBuilds:
