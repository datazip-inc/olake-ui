version: '3.8'

services:
  postgres:
    image: postgres:15
    container_name: olake_postgres-test
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: secret1234
      POSTGRES_DB: postgres
    ports:
      - "5433:5432"
    volumes:
      - ./pg_hba.conf:/etc/postgresql/pg_hba.conf
    command:
      - bash
      - -c
      - |
        # Start PostgreSQL with logical replication in background. wal_sender_timeout=0 keeps a
        # long CDC sync from being disconnected; OLake's CDC prerequisite checks recommend it.
        docker-entrypoint.sh postgres \
          -c hba_file=/etc/postgresql/pg_hba.conf \
          -c listen_addresses='*' \
          -c wal_level=logical \
          -c max_wal_senders=10 \
          -c max_replication_slots=10 \
          -c wal_sender_timeout=0 &

        # Wait for PostgreSQL to be ready
        while ! pg_isready -U postgres -h localhost -p 5432; do
          sleep 1
        done

        # OLake's Postgres CDC reads a pgoutput slot through a publication. FOR ALL TABLES also
        # covers the tables the test creates later. The slot is created in its own statement: a
        # logical slot cannot be created in a transaction that has already written.
        psql -v ON_ERROR_STOP=1 -U postgres <<EOF
        DO \$\$
        BEGIN
          IF NOT EXISTS (SELECT 1 FROM pg_publication WHERE pubname = 'olake_publication') THEN
            CREATE PUBLICATION olake_publication FOR ALL TABLES;
          END IF;
        END
        \$\$;
        EOF
        psql -v ON_ERROR_STOP=1 -U postgres -c "SELECT pg_create_logical_replication_slot('olake_slot', 'pgoutput') WHERE NOT EXISTS (SELECT 1 FROM pg_replication_slots WHERE slot_name = 'olake_slot')"

        # Keep container running
        wait
