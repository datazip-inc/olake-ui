APP_NAME: olake-server
HTTP_PORT: "8000"
HTTP_READ_HEADER_TIMEOUT: "10s"
HTTP_READ_TIMEOUT: "600s"
HTTP_WRITE_TIMEOUT: "600s"
HTTP_IDLE_TIMEOUT: "600s"
# RUN_MODE is auto-detected: "dev" for Docker, "staging" for Kubernetes (via KUBERNETES_SERVICE_HOST).
# Override explicitly via RUN_MODE env var or uncomment below if needed.
# RUN_MODE: dev

MAX_MEMORY: 67108864
MAX_UPLOAD_SIZE: 67108864

# Either provide a full DSN here...
POSTGRES_DB: ""
# ...or configure via individual parts below.
OLAKE_POSTGRES_USER: temporal
OLAKE_POSTGRES_PASSWORD: temporal
OLAKE_POSTGRES_HOST: postgresql
OLAKE_POSTGRES_PORT: "5432"
OLAKE_POSTGRES_DBNAME: postgres
OLAKE_POSTGRES_SSLMODE: disable

LOGS_DIR: ./logger/logs
SESSION_ON: true

TEMPORAL_ADDRESS: temporal:7233
TEMPORAL_NAMESPACE: default
TEMPORAL_ENABLE_TLS: false
TEMPORAL_API_KEY: ""
TEMPORAL_EXTERNAL: false
TEMPORAL_TASK_QUEUE: ""
CONTAINER_REGISTRY_BASE: registry-1.docker.io

# Optional credentials/TLS for a generic private Docker Registry v2 registry
# (Harbor, Nexus, Quay, GitLab, plain registry:2). Leave empty for Docker Hub or
# for ECR/GCR (which authenticate via cloud IAM). Prefer setting these via environment.
# CONTAINER_REGISTRY_USERNAME: ""
# CONTAINER_REGISTRY_PASSWORD: ""
# CONTAINER_REGISTRY_INSECURE: false        # allow plain-HTTP registries (e.g. host:5000)
# CONTAINER_REGISTRY_TLS_SKIP_VERIFY: false # skip TLS verification for self-signed HTTPS
# CONTAINER_REGISTRY_CA_CERT: ""            # PEM CA bundle contents for a private CA

# Prefer setting this via environment.
OLAKE_SECRET_KEY: ""

# Optimization module configuration
ENABLE_OPTIMIZATION: false
OPTIMIZATION_BASE_URL: http://127.0.0.1:1630
OPTIMIZATION_GROUP: spark-container
# Per-request timeout for a single Amoro HTTP call. Override via env
# OPTIMIZATION_REQUEST_TIMEOUT when deploying via Helm / docker-compose.
OPTIMIZATION_REQUEST_TIMEOUT: "30s"
